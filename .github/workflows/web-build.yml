name: VeloTrack Web Build
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
