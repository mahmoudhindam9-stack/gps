name: VeloTrack GitHub Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.3.0)"
        required: true
        default: "v1.3.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Backend Tests
        run: |
          npm --prefix backend ci || npm --prefix backend install
          npm --prefix backend test

      - name: Build Web Dashboard
        run: |
          npm --prefix web ci || npm --prefix web install
          npm --prefix web run build
          tar -czf velotrack-web-dist.tar.gz -C web/dist .

      - name: Package Backend & Ordered Database Migrations
        run: |
          tar -czf velotrack-backend.tar.gz -C backend src sql package.json package-lock.json
          cp backend/sql/schema.sql schema.sql
          tar -czf velotrack-sql-migrations.tar.gz -C backend/sql migrations

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest

      - name: Build Android APK (Signed Release if Keystore Configured, Otherwise Explicitly Labeled DEBUG)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk velotrack-android-release.apk
            rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
          else
            gradle :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk velotrack-android-DEBUG.apk
          fi

      - name: Generate SHA-256 Checksums
        run: |
          sha256sum velotrack-* schema.sql > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "VeloTrack GPS ${{ github.event.inputs.tag_name || github.ref_name }}"
          generate_release_notes: true
          files: |
            velotrack-android-*.apk
            velotrack-web-dist.tar.gz
            velotrack-backend.tar.gz
            velotrack-sql-migrations.tar.gz
            schema.sql
            SHA256SUMS.txt
