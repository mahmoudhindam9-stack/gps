name: VeloTrack GitHub Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Backend Tests
        run: |
          npm --prefix backend ci || npm --prefix backend install
          npm --prefix backend test

      - name: Build Web Dashboard
        run: |
          npm --prefix web ci || npm --prefix web install
          npm --prefix web run build
          tar -czf velotrack-web-dist.tar.gz -C web/dist .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk velotrack-android.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "VeloTrack GPS ${{ github.event.inputs.tag_name || github.ref_name }}"
          generate_release_notes: true
          files: |
            velotrack-android.apk
            velotrack-web-dist.tar.gz
