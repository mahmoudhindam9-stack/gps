name: velotrack-supabase

services:
  supabase-db:
    image: ${SUPABASE_DB_IMAGE:-supabase/postgres:15.8.1.040}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - app.settings.jwt_secret=${JWT_SECRET:?Set JWT_SECRET in deployment/supabase/.env}
      - -c
      - app.settings.jwt_exp=${JWT_EXPIRY:-3600}
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/supabase/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/supabase/.env}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deployment/supabase/.env}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      supabase-private:
      velotrack-shared:
        aliases:
          - supabase-db

  supabase-auth:
    image: ${SUPABASE_AUTH_IMAGE:-supabase/gotrue:v2.167.0}
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://supabase-kong:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deployment/supabase/.env}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      supabase-private:
      velotrack-shared:
        aliases:
          - supabase-auth

  supabase-rest:
    image: ${SUPABASE_REST_IMAGE:-postgrest/postgrest:v12.2.3}
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deployment/supabase/.env}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    networks:
      supabase-private:
      velotrack-shared:
        aliases:
          - supabase-rest

  supabase-kong:
    image: ${SUPABASE_KONG_IMAGE:-kong:2.8.1}
    restart: unless-stopped
    depends_on:
      supabase-auth:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      SUPABASE_ANON_KEY: ${ANON_KEY:?Set ANON_KEY in deployment/supabase/.env}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY in deployment/supabase/.env}
    ports:
      - "127.0.0.1:8000:8000/tcp"
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      supabase-private:
      velotrack-shared:
        aliases:
          - supabase-kong

networks:
  supabase-private:
    driver: bridge
  velotrack-shared:
    external: true
    name: velotrack-shared

volumes:
  supabase-db-data:
